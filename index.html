<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Technical skills and project work by MD. Nazmul Islam Khan."
    />
    <title>Technical Skills &amp; Projects — MD. Nazmul Islam Khan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="standalone-page" aria-labelledby="page-title">
      <header class="page-intro">
        <p class="eyebrow">Capabilities &amp; work</p>
        <h1 id="page-title">Technical Skills &amp; Projects</h1>
        <p>Explore my technical skills, programming languages, development tools, and software projects.</p>
      </header>

      <section aria-labelledby="skills-title">
        <div class="section-heading">
          <span class="eyebrow">Technical skills</span>
          <h2 id="skills-title">Tools I have worked with</h2>
        </div>
        <div class="skills-grid" id="skills-grid"></div>
      </section>

      <section class="projects-section" aria-labelledby="projects-title">
        <div class="section-heading">
          <span class="eyebrow">Academic &amp; personal work</span>
          <h2 id="projects-title">Project portfolio</h2>
          <p>Select a project to explore the available details.</p>
        </div>
        <div class="projects-layout">
          <div class="project-select-list" id="project-selector" role="tablist" aria-label="Projects"></div>
          <article class="project-detail" id="project-detail" aria-live="polite"></article>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
